name: Refresh LALIGA HYPERMOTION dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-dashboard.yml'
      - 'README.md'
      - 'build_laliga2_dashboard.py'
      - 'capture_*.py'
      - 'fetch_official_laliga2.py'
      - 'refresh_laliga2_2026_27.sh'
      - 'validate_laliga2.py'
  schedule:
    # GitHub cron uses UTC; 09:10 UTC = 06:10 in Sao Paulo.
    - cron: '10 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laliga-hypermotion-dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the existing dashboard repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install refresh dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Set Sao Paulo validation cutoff
        run: echo "LALIGA2_CUTOFF=$(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M America/Sao_Paulo')" >> "$GITHUB_ENV"
      - name: Fetch, cross-check, validate and rebuild
        run: bash refresh_laliga2_2026_27.sh
      - name: Verify dynamic freshness/count labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          report = json.loads((root / 'laliga2_2026_27_validation.json').read_text())
          page = (root / 'index.html').read_text()
          count = report['coverage']['confirmed_final_scores_used']
          assert report['official_table_reconciliation']['clubs_exactly_matching_all_fields'] == 22
          assert report['independent_ESPN_crosscheck']['identical_final_scores'] == count
          assert f'{count} jogos com placar final verificado' in page
          assert report['cutoff'] in page
          assert '105 jogos com placar final verificado' not in page
          PY
      - name: Commit validated refresh only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/refresh-dashboard.yml build_laliga2_dashboard.py \
            laliga2_2026_27_matches_official.csv \
            laliga2_2026_27_official_table_snapshot.csv \
            laliga2_2026_27_official_home_table_snapshot.csv \
            laliga2_2026_27_official_away_table_snapshot.csv \
            laliga2_2026_27_official_zones.json \
            laliga2_2026_27_espn_result_crosscheck.csv \
            espn_2026_27_standings_from_scores.csv \
            laliga2_2026_27_espn_crosscheck.json \
            laliga2_2026_27_computed_all_table.csv \
            laliga2_2026_27_computed_home_table.csv \
            laliga2_2026_27_computed_away_table.csv \
            laliga2_2026_27_validation.json \
            laliga2_2026_27_validation.txt laliga2_2026_27_source_log.json index.html
          if git diff --cached --quiet; then
            echo 'No validated dashboard changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh LALIGA HYPERMOTION dashboard after validation'
          git push
